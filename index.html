<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Say It · Study Hall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Say It: a companion page for Study Hall. It runs outside Apps Script so the browser can ask for the microphone.
     The words arrive in the link (after #) and never leave this device: nothing is uploaded or saved. */
  :root { --bg: #F3F4F8; --card: #fff; --ink: #1B2238; --muted: #5F6680; --line: #DDE1EA; --accent: #4C6FE0; --good: #2E9D63; --close: #D99A1E; --bad: #D64545; --sun: #FFC53D }
  @media (prefers-color-scheme: dark) { :root { --bg: #14172A; --card: #1E2340; --ink: #F1F3FA; --muted: #A9B0C8; --line: #333A5C; --accent: #8FA6FF } }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 600 1rem/1.4 Nunito, Arial, sans-serif; min-height: 100vh; display: flex; justify-content: center; padding: 16px }
  main { width: min(640px, 100%); display: flex; flex-direction: column; gap: 16px }
  header { display: flex; align-items: center; gap: 12px } header h1 { font: 700 1.5rem Fraunces, Georgia, serif; margin: 0; flex: 1 } .count { color: var(--muted); font-weight: 800 }
  .bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden } .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s }
  .card { background: var(--card); border-radius: 22px; padding: 26px 22px; box-shadow: 0 4px 18px rgba(0, 0, 0, .08); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center }
  .ask { color: var(--muted); font-weight: 800; letter-spacing: .02em } .prompt { font: 700 clamp(1.8rem, 6vw, 2.6rem)/1.15 Fraunces, Georgia, serif; overflow-wrap: anywhere }
  .mic { width: 120px; height: 120px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; cursor: pointer; display: grid; place-items: center; box-shadow: 0 6px 0 rgba(0, 0, 0, .18); transition: transform .1s }
  .mic:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, .18) } .mic svg { width: 54px; height: 54px }
  .mic.on { background: var(--bad); animation: pulse 1.1s ease-in-out infinite } @keyframes pulse { 50% { box-shadow: 0 0 0 18px rgba(214, 69, 69, .18) } }
  .hint { color: var(--muted); font-size: .95rem; min-height: 1.4em }
  .result { width: 100%; border-radius: 16px; padding: 14px; display: none; flex-direction: column; gap: 6px } .result.show { display: flex }
  .result b { font: 700 1.4rem Fraunces, Georgia, serif } .result.good { background: rgba(46, 157, 99, .14); color: var(--good) } .result.close { background: rgba(217, 154, 30, .16); color: var(--close) } .result.bad { background: rgba(214, 69, 69, .12); color: var(--bad) }
  .result span { color: var(--ink) } .answer { font: 700 1.3rem Fraunces, Georgia, serif }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center }
  button.btn { border: 0; border-radius: 14px; padding: 12px 20px; font: 800 1rem Nunito, Arial, sans-serif; cursor: pointer; background: var(--line); color: var(--ink) } button.btn.main { background: var(--sun); color: #1B1E3C }
  .note { color: var(--muted); font-size: .85rem; text-align: center } .end { font: 700 2rem Fraunces, Georgia, serif } .stars { font-size: 2.4rem; letter-spacing: 6px }
  ul.sum { list-style: none; padding: 0; margin: 0; width: 100%; text-align: left } ul.sum li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line) }
</style>
</head>
<body>
<main id="app"><div class="card"><p class="ask">Loading…</p></div></main>
<script>
/* The words come in the link: #<encoded JSON> { n: unit name, w: [[term, definition, language code], ...] }. */
const MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const LOCALE = { es: 'es-US', fr: 'fr-FR', de: 'de-DE', it: 'it-IT', pt: 'pt-BR', en: 'en-US', zh: 'zh-CN', ja: 'ja-JP', ko: 'ko-KR', ar: 'ar-SA', ru: 'ru-RU', nl: 'nl-NL', pl: 'pl-PL', tr: 'tr-TR', vi: 'vi-VN', la: 'it-IT', hi: 'hi-IN', he: 'he-IL', el: 'el-GR', sv: 'sv-SE' };
const $ = id => document.getElementById(id), app = $('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let D = null; try { D = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch (e) { D = null; }
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
/* a word as something to compare: lower case, no accents or punctuation */
const norm = s => String(s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss').replace(/[^\p{L}\p{N} ]+/gu, ' ').replace(/\s+/g, ' ').trim();
const ARTICLES = /^(el|la|los|las|un|una|le|les|l|une|des|der|die|das|ein|eine|il|lo|gli|i|o|a|os|as|um|uma|the|a|an|to) /;
function lev(a, b) { const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]); for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[m][n]; }
/* how close what was heard is to the word (or any of its meanings, with or without its article): 0 to 1 */
function score(heard, term) {
  const forms = String(term).split(/[;\/]|, /).map(norm).filter(Boolean).flatMap(f => [f, f.replace(ARTICLES, '')]);
  let best = 0; heard.map(norm).forEach(h => forms.forEach(f => { const hs = [h, h.replace(ARTICLES, '')]; hs.forEach(x => { if (!x || !f) return; best = Math.max(best, x === f ? 1 : x.includes(f) && f.length > 3 ? .95 : 1 - lev(x, f) / Math.max(x.length, f.length)); }); }));
  return best;
}
function say(text, lang) { try { const u = new SpeechSynthesisUtterance(text); u.lang = LOCALE[lang] || lang || 'en-US'; const v = speechSynthesis.getVoices().find(x => x.lang && x.lang.toLowerCase().startsWith((lang || 'en').toLowerCase())); if (v) u.voice = v; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }

if (!D || !Array.isArray(D.w) || !D.w.length) app.innerHTML = '<div class="card"><p class="prompt">No words here</p><p class="hint">Open Say It from the Say It tile in Study Hall.</p></div>';
else if (!SR) app.innerHTML = '<div class="card"><p class="prompt">Open this in Chrome</p><p class="hint">Say It listens with Chrome’s speech recognition. Open the link in Chrome (on a Chromebook it already is).</p></div>';
else start();

function start() {
  const words = D.w.slice(0, 60), res = []; let i = 0, tries = 0;
  const paint = () => {
    const w = words[i];
    app.innerHTML = `<header><h1>Say It${D.n ? ' · ' + esc(D.n) : ''}</h1><span class="count">${i + 1} of ${words.length}</span></header><div class="bar"><i style="width:${100 * i / words.length}%"></i></div>
      <div class="card"><p class="ask">Say the word for</p><p class="prompt">${esc(w[1] || '?')}</p>
        <button class="mic" id="mic" aria-label="Tap, then say the word">${MIC}</button><p class="hint" id="hint">Tap the microphone, then say the word.</p>
        <div class="result" id="res"></div>
        <div class="row"><button class="btn" id="skip">Skip</button></div></div>
      <p class="note">Your voice is only listened to by your browser to check the word. Nothing is recorded or saved.</p>`;
    $('mic').onclick = () => listen(w); $('skip').onclick = () => { res.push([w, 0, '']); next(); };
  };
  const next = () => { i++; tries = 0; if (i < words.length) paint(); else done(); };
  /* Chrome stops a listener it thinks nobody is holding (error: aborted), so the page keeps it in window.REC, asks for the microphone once first, and retries once if it is cut off. */
  async function micReady() { if (window.MIC_OK) return true; try { const st = await navigator.mediaDevices.getUserMedia({ audio: true }); st.getTracks().forEach(t => t.stop()); window.MIC_OK = true; return true; } catch (e) { $('hint').textContent = 'The microphone is blocked. Click the lock or microphone icon in the address bar, choose Allow, then reload this page.'; return false; } }
  async function listen(w, retry) {
    if (!(await micReady())) return;
    try { if (window.REC) window.REC.abort(); } catch (e) {}
    const r = new SR(); window.REC = r; r.lang = LOCALE[w[2]] || w[2] || 'en-US'; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
    const mic = $('mic'), hint = $('hint'); mic.classList.add('on'); hint.textContent = 'Listening… say it now.'; let got = false;
    r.onresult = e => { got = true; const alts = [...e.results[0]].map(a => a.transcript); show(w, alts); };
    r.onerror = e => { mic.classList.remove('on'); if (e.error === 'aborted' && !retry && !got) { setTimeout(() => listen(w, true), 250); return; } hint.textContent = e.error === 'aborted' ? 'Listening stopped. Tap the microphone and try again.' : e.error === 'network' ? 'Say It needs the internet to listen. Check the connection and try again.' : e.error === 'audio-capture' ? 'No microphone was found. Check that one is connected and turned on.' : e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'The microphone is blocked. Click the lock or microphone icon in the address bar, choose Allow, then reload this page.' : e.error === 'no-speech' ? 'I did not hear anything. Tap and try again, a little louder.' : 'Something went wrong (' + e.error + '). Tap and try again.'; };
    r.onend = () => { if (window.REC === r) window.REC = null; mic.classList.remove('on'); if (!got && hint.textContent.indexOf('Listening') === 0) hint.textContent = 'I did not hear anything. Tap and try again.'; };
    try { r.start(); } catch (e) { mic.classList.remove('on'); }
  }
  function show(w, alts) {
    tries++; const s = score(alts, w[0]), kind = s >= .85 ? 'good' : s >= .6 ? 'close' : 'bad', box = $('res');
    box.className = 'result show ' + kind; $('hint').textContent = '';
    box.innerHTML = `<b>${kind === 'good' ? 'Great!' : kind === 'close' ? 'Close!' : 'Not quite'}</b><span>I heard: “${esc(alts[0] || '')}”</span>${kind === 'good' ? '' : `<span>The word is <span class="answer">${esc(w[0])}</span></span>`}
      <div class="row"><button class="btn" id="hear">🔊 Hear it</button>${kind === 'good' ? '' : '<button class="btn" id="again">Try again</button>'}<button class="btn main" id="nx">${i + 1 < words.length ? 'Next' : 'Finish'}</button></div>`;
    $('hear').onclick = () => say(w[0], w[2]); const a = $('again'); if (a) a.onclick = () => { box.className = 'result'; $('hint').textContent = 'Tap the microphone, then say the word.'; };
    $('nx').onclick = () => { res.push([w, kind === 'good' ? 2 : kind === 'close' ? 1 : 0, alts[0] || '']); next(); };
    if (kind !== 'good') say(w[0], w[2]);
  }
  function done() {
    const great = res.filter(x => x[1] === 2).length, pct = res.length ? great / res.length : 0;
    app.innerHTML = `<div class="card"><p class="end">${pct >= .8 ? 'Wonderful!' : pct >= .5 ? 'Nice work!' : 'Good practice!'}</p><p class="stars">${'★'.repeat(Math.max(1, Math.round(pct * 5)))}${'☆'.repeat(5 - Math.max(1, Math.round(pct * 5)))}</p>
      <p><b>${great}</b> of ${res.length} said just right</p>
      <ul class="sum">${res.map(x => `<li><span>${esc(x[0][0])}</span><span>${x[1] === 2 ? '✓ Great' : x[1] === 1 ? '≈ Close' : x[2] ? '✗ Try again' : '– Skipped'}</span></li>`).join('')}</ul>
      <div class="row"><button class="btn main" id="redo">Practice the tricky ones</button><button class="btn" id="close">Close</button></div></div>`;
    $('close').onclick = () => window.close();
    $('redo').onclick = () => { const tricky = res.filter(x => x[1] < 2).map(x => x[0]); if (!tricky.length) return; D.w = tricky; start(); };
  }
  paint();
}
</script>
</body>
</html>
